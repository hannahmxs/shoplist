<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Shops</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 {
    margin-bottom: 40px;
    font-size: 28px;
  }
  a.link-button {
    display: block;
    width: 100%;
    max-width: 420px;
    text-decoration: none;
    text-align: center;
    padding: 10px 16px;
    margin-bottom: 12px;
    border-radius: 10px;
    color: #333;
    transition: 0.2s;
  }
  a.link-button:hover {
    filter: brightness(0.95);
    transform: translateY(-1px);
  }
  a.link-button .shop-name {
    display: block;
    font-weight: bold;
    font-size: 16px;
  }
  a.link-button .shop-category {
    display: block;
    font-weight: 300;
    font-size: 13px;
    margin-top: 2px;
  }
  .raw-rare   { background: #d7e3f4; }
  .eyes-tries { background: #f6d6d6; }
  .nordlicht  { background: #d4ecdd; }
  .seven-seas { background: #fdeecb; }
  .looks-n-brains { background: #e6d9f2; }
  footer {
    margin-top: auto;
    padding-top: 60px;
    font-size: 12px;
    color: #666;
    font-weight: 300;
  }
</style>
</head>
<body>

<h1>Meine Shops</h1>

<a class="link-button raw-rare" href="https://juniqe.com/p/raw-and-rare/cprvkxlm" target="_blank">
  <span class="shop-name">Raw & Rare</span>
  <span class="shop-category">s/w photography</span>
</a>

<a class="link-button eyes-tries" href="https://juniqe.com/p/ytmwirhq" target="_blank">
  <span class="shop-name">Eyes & Tries</span>
  <span class="shop-category">photography</span>
</a>

<a class="link-button nordlicht" href="https://juniqe.com/p/dncillkz" target="_blank">
  <span class="shop-name">Nordlicht Atelier</span>
  <span class="shop-category">paintings</span>
</a>

<a class="link-button seven-seas" href="https://juniqe.com/p/akjoocsf" target="_blank">
  <span class="shop-name">7 Seas</span>
  <span class="shop-category">posters</span>
</a>

<a class="link-button looks-n-brains" href="https://juniqe.com/p/looks-n-brains/jpvgbrri" target="_blank">
  <span class="shop-name">Looks n Brains</span>
  <span class="shop-category">typography</span>
</a>

<footer>Hannah Marahrens · alle Shops auf Juniqe</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Shops</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 {
    margin-bottom: 40px;
    font-size: 28px;
    color: #000;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  a.card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: #333;
    overflow: hidden;
    transition: 0.2s;
  }
  a.card:hover {
    transform: translateY(-3px);
  }
  a.card .img-frame {
    padding: 14px 14px 0;
  }
  a.card .img-frame img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    display: block;
    background: #fff;
  }
  a.card .card-content {
    padding: 12px 16px 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }
  a.card .shop-name {
    display: block;
    font-weight: bold;
    font-size: 16px;
  }
  a.card .shop-category {
    display: block;
    font-weight: 300;
    font-size: 13px;
    margin-top: 2px;
  }
  a.card .cta {
    font-size: 11px;
    text-decoration: underline;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: auto;
    padding-top: 10px;
  }
  .eyes-tries { background: #f6d6d6; }
  .raw-rare   { background: #d7e3f4; }
  .nordlicht  { background: #d4ecdd; }
  .seven-seas { background: #fdeecb; }
  .looks-n-brains { background: #e6d9f2; }
  .flower-box { background: #fbe0ef; }
  footer {
    margin-top: 60px;
    font-size: 12px;
    color: #000;
    font-weight: 300;
  }

  @media (max-width: 600px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<h1>Meine Shops</h1>

<div class="grid">

  <a class="card eyes-tries" href="https://juniqe.com/p/ytmwirhq" target="_blank">
    <div class="img-frame"><img src="eyes_and_tries2.jpg" alt="Eyes & Tries"></div>
    <div class="card-content">
      <span class="shop-name">Eyes & Tries</span>
      <span class="shop-category">photography</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

  <a class="card raw-rare" href="https://juniqe.com/p/raw-and-rare/cprvkxlm" target="_blank">
    <div class="img-frame"><img src="raw_and_rare2.jpg" alt="Raw & Rare"></div>
    <div class="card-content">
      <span class="shop-name">Raw & Rare</span>
      <span class="shop-category">s/w photography</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

  <a class="card nordlicht" href="https://juniqe.com/p/dncillkz" target="_blank">
    <div class="img-frame"><img src="nordlicht_atelier2.jpg" alt="Nordlicht Atelier"></div>
    <div class="card-content">
      <span class="shop-name">Nordlicht Atelier</span>
      <span class="shop-category">paintings</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

  <a class="card seven-seas" href="https://juniqe.com/p/akjoocsf" target="_blank">
    <div class="img-frame"><img src="seven_seas2.jpg" alt="7 Seas"></div>
    <div class="card-content">
      <span class="shop-name">7 Seas</span>
      <span class="shop-category">posters</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

  <a class="card looks-n-brains" href="https://juniqe.com/p/looks-n-brains/jpvgbrri" target="_blank">
    <div class="img-frame"><img src="looks_n_brains2.jpg" alt="Looks n Brains"></div>
    <div class="card-content">
      <span class="shop-name">Looks n Brains</span>
      <span class="shop-category">typography</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

  <a class="card flower-box" href="https://juniqe.com/p/flower-box/fkplpdrj" target="_blank">
    <div class="img-frame"><img src="flower_box2.jpg" alt="Flower Box"></div>
    <div class="card-content">
      <span class="shop-name">Flower Box</span>
      <span class="shop-category">nature photography</span>
      <span class="cta">Zum Shop</span>
    </div>
  </a>

</div>

<footer>Hannah Marahrens · Shops auf Juniqe</footer>

</body>
</html>
